name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Additional version tag for the image (e.g. 1.5.5)"
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Look up Dystopia server build on Steam
        id: steam
        run: |
          buildid="$(curl -fsS https://api.steamcmd.net/v1/info/17585 | jq -r '.data["17585"].depots.branches.public.buildid // empty')" || true
          if [ -z "$buildid" ]; then
            echo "::warning::Could not look up the Steam buildid, building without a build-* tag"
          else
            echo "Steam public buildid: $buildid"
          fi
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DYS_BUILDID=${{ steps.steam.outputs.buildid || github.run_id }}
          tags: |
            atomy/dystopia-server:latest
            ${{ steps.steam.outputs.buildid && format('atomy/dystopia-server:build-{0}', steps.steam.outputs.buildid) || '' }}
            ${{ inputs.version && format('atomy/dystopia-server:{0}', inputs.version) || '' }}
